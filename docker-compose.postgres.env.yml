version: '3.8'

# Edit the environment section below, then run:
# docker-compose -f docker-compose.postgres.env.yml up -d

services:
  laffey:
    image: ghcr.io/weeb-devs/laffey:latest
    container_name: laffey-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production

      # ===== REQUIRED: Edit these =====
      client.token: "YOUR-BOT-TOKEN-HERE"
      client.id: "YOUR-BOT-ID-HERE"
      # ================================

      # Optional settings
      client.prefix: "!"
      client.statuses: '["Laffey music bot", "discord.js v14"]'

      # Genius API for lyrics (optional)
      genius.api_key: ""

      # Slash commands
      slash.register: "true"
      slash.guild_id: ""

      # Bot owners
      owners: '["YOUR-DISCORD-ID-HERE", "YOUR-DISCORD-ID-HERE-2"]'

      # Database (PostgreSQL)
      database.type: postgres
      database.postgres.host: postgres
      database.postgres.port: "5432"
      database.postgres.user: laffey
      database.postgres.password: secure-password
      database.postgres.database: laffey

      # Embed colors (optional)
      embed.colors.default: "#6b92f3"
      embed.colors.success: "#43b581"
      embed.colors.error: "#f87171"
      embed.colors.warning: "#fbbf24"
      embed.footer.text: ""

      # Music player, UPDATE WITH YOUR LAVALINK NODE
      player.embed_mode: edit
      player.default_search: ""
      player.nodes: '[{"name":"Main","url":"localhost:2333","auth":"youshallnotpass"}]'